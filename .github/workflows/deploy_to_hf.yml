name: Deploy to Hugging Face
on:
  push:
    branches: [main]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Replace 'EATosin' and 'NewsAgent-Pro' with your exact names
          HF_URL: "https://EATosin:$HF_TOKEN@huggingface.co/spaces/EATosin/NewsAgent-Pro"
        run: |
          git remote add space $HF_URL
          git push --force space main
